name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          set -euo pipefail

          if [ -d "/Applications/Xcode_26.3.0.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_26.3.0.app"
          else
            echo "Xcode 26.3.0 not found."
            xcodebuild -version
          fi

          xcodebuild -version
          swift --version

      - name: Cache Swift Package Manager
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-spm-${{ hashFiles('Feather.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-spm-

      - name: Prepare build
        run: |
          set -euo pipefail

          rm -rf _build
          rm -rf packages
          mkdir -p packages

      - name: Set build version
        run: |
          set -euo pipefail

          VERSION="$(git rev-parse HEAD)"

          echo "Setting build version to:"
          echo "$VERSION"

          agvtool new-version -all "$VERSION"

      - name: Build
        run: |
          set -euo pipefail
          make

      - name: Get Version
        id: get_version
        run: |
          set -euo pipefail

          APP_PATH="$(find _build -type f -path '*/Feather.app/Info.plist' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "Feather.app/Info.plist not found."
            find _build -maxdepth 5 -print || true
            exit 1
          fi

          VERSION=$(/usr/libexec/PlistBuddy \
            -c "Print CFBundleShortVersionString" \
            "$APP_PATH")

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Version: ${VERSION}"

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v3.0.2
        with:
          name: Feather v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            packages/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
